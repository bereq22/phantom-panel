name: build-windows-exe

on:
  workflow_dispatch:        # botao "Run workflow" na aba Actions
  push:
    paths:
      - 'phantom_panel.py'
      - 'phantom.ico'
      - '.github/workflows/build-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build PhantomPanel.exe
        run: pyinstaller --onefile --noconsole --name PhantomPanel --icon phantom.ico phantom_panel.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PhantomPanel-exe
          path: dist/PhantomPanel.exe
